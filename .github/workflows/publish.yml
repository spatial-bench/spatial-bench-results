name: Publish dataset

# The results repo is the source of truth; this collates it into one
# SQLite file and pushes it to R2 on every merge to main. The artifact is
# content-addressed (immutable, cache forever); latest.json is the only
# mutable pointer and the front-end polls it to detect a new snapshot.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Checkout the engine
        uses: actions/checkout@v4
        with:
          repository: spatial-bench/spatial-bench-core
          ref: main
          path: engine

      - name: Install `stable` toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build the collator
        run: cargo build --release -p spatial-bench
        working-directory: engine

      - name: Collate
        run: |
          SHA="${GITHUB_SHA::12}"
          ./engine/target/release/spatial-bench publish \
            --results . \
            --out "benchmarks-$SHA.sqlite" \
            --sha "$SHA"
          # gzip: the browser's DecompressionStream('gzip') decompresses it
          # natively — no wasm codec in the client for what zstd saves here.
          # gzip replaces the file, so the integrity hash is taken first:
          # it must describe the bytes the app actually opens (decompressed).
          SHA256=$(sha256sum "benchmarks-$SHA.sqlite" | cut -d' ' -f1)
          gzip -9 "benchmarks-$SHA.sqlite"

      - name: Push to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          SHA="${GITHUB_SHA::12}"
          DB="benchmarks-$SHA.sqlite.gz"
          # Immutable: the object name carries the revision, so cache forever.
          aws s3 cp "$DB" "s3://$R2_BUCKET/$DB" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/sqlite3" \
            --content-encoding "gzip" \
            --cache-control "public, max-age=31536000, immutable"
          # latest.json is the pointer — written last, cached not at all.
          SIZE=$(stat -c%s "$DB")
          printf '{"db": "%s", "sha": "%s", "sha256": "%s", "bytes": %s, "generated_at": "%s"}\n' \
            "$DB" "$SHA" "$SHA256" "$SIZE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > latest.json
          aws s3 cp latest.json "s3://$R2_BUCKET/latest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/json" \
            --cache-control "no-cache"
